spring.application.name=petcare-api
server.port=8081

# Banco H2 gravado em arquivo (./data): os dados continuam salvos depois de reiniciar a API.
spring.datasource.url=jdbc:h2:file:./data/petcare
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update

# Os services devolvem DTOs, então nenhuma consulta ao banco precisa acontecer no controller.
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
